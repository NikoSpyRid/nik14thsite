<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
</head>

<body>


<h1> Wallet  </h1>

<p id="balance-display"> Φόρτωση ... </p>
<button onclick="spendMoney()"> Αγορά Καφέ 5 euro</button>

<script>
if (!localStorage.getItem("user_wallet")) {
const initialData = {
userId: "USR-9942",
sessionToken : "abcdefghi",
balance: 50
};
localStorage.setItem("user_wallet", JSON.stringify(initialData));
}

function loadWallet() {
const data = JSON.parse(localStorage.getItem("user_wallet"));
document.getElementById('balance-display').innerText = "Διαθέσιμο υπόλοιπο " +data.balance ;
}


function spendMoney() {
const data = JSON.parse(localStorage.getItem("user_wallet"));
if (data.balance >=-0) {
data.balance -=5;
localStorage.setItem("user_wallet",JSON.stringify(data));
loadWallet();
}

}


</script>
  </body>
  </html>
